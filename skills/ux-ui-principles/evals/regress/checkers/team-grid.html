<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Team</title>
<!-- Regression for slop_check icon-card-row: three photo cards (images > 64px) are a team grid, not icon cards. -->
<style>.person img{width:240px;height:300px;object-fit:cover;border-radius:8px}</style></head><body>
<h1>Our team</h1>
<div class="team">
  <article class="person"><img src="a.jpg" alt="Dr A"><h3>Dr A</h3><p>Orthodontics</p></article>
  <article class="person"><img src="b.jpg" alt="Dr B" width="240" height="300"><h3>Dr B</h3><p>Kids</p></article>
  <article class="person"><img src="c.jpg" alt="Dr C"><h3>Dr C</h3><p>Implants</p></article>
</div></body></html>
